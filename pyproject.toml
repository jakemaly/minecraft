[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-agent-harness"
version = "0.1.0"
description = "ChatGPT-controlled marimo harness for Minecraft agent experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
notebook = ["marimo==0.23.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
